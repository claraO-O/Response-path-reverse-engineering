<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>回應路徑逆向工程 · 酒館</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <button id="toggleLeft" title="連線設定">⚙ 連線</button>
  <div class="title">回應路徑逆向工程 <small>機率坍塌掃描儀 · 酒館版</small></div>
  <span id="status" class="status">未連線</span>
  <button id="toggleRight" title="情境設定">🎭 情境</button>
</header>
<div class="layout">
  <aside id="left" class="panel">
    <h2>API 連線</h2>
    <label>連線類型
      <select id="provider">
        <option value="openai">OpenAI 相容（含 OpenRouter 等）</option>
        <option value="gemini">Google Gemini</option>
        <option value="anthropic">Anthropic Claude</option>
        <option value="ollama">本地 · Ollama</option>
        <option value="lmstudio">本地 · LM Studio</option>
        <option value="koboldcpp">本地 · KoboldCpp</option>
        <option value="custom">自訂 OpenAI 相容端點</option>
      </select>
    </label>
    <label>Base URL <input id="baseUrl" placeholder="https://api.openai.com/v1" /></label>
    <label>API 金鑰 <input id="apiKey" type="password" placeholder="本地模型可留空" autocomplete="off" /></label>
    <p class="note">🔒 金鑰只存在你這台瀏覽器的 localStorage，請求直接從瀏覽器送到你設定的端點，不經過任何其他伺服器。</p>
    <label>模型
      <div class="row"><input id="model" list="modelList" placeholder="例如 gpt-4o-mini" /><button id="fetchModels">取得列表</button></div>
      <datalist id="modelList"></datalist>
    </label>
    <label>Temperature <span id="tempVal"></span><input id="temperature" type="range" min="0" max="2" step="0.05" /></label>
    <label>最大輸出 Tokens <input id="maxTokens" type="number" min="256" step="256" /></label>
    <label class="check"><input id="jsonMode" type="checkbox" /> 要求 JSON 結構化輸出（模型不支援時請關閉）</label>
    <div class="row"><button id="testConn">測試連線</button><button id="clearKey" class="danger">清除金鑰</button></div>
  </aside>
  <main class="chat">
    <div id="messages" class="messages"></div>
    <form id="composer" class="composer">
      <textarea id="input" rows="3" placeholder="輸入要被「逆向解析」的提示詞… (Enter 送出，Shift+Enter 換行)"></textarea>
      <button id="send" type="submit">解析</button>
    </form>
  </main>
  <aside id="right" class="panel">
    <h2>前置情境 / 角色設定</h2>
    <p class="note">對應舊版的「User Context / Persona」，會一起送進分析。</p>
    <textarea id="context" rows="8" placeholder="例如：使用者已把 AI 設定為霸道哥哥，長期互動…"></textarea>
    <h2>系統提示詞（分析引擎）</h2>
    <textarea id="systemPrompt" rows="12"></textarea>
    <div class="row"><button id="resetPrompt">還原預設</button><button id="clearChat" class="danger">清空對話</button></div>
  </aside>
</div>
<script src="prompts.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
